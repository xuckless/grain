[package]
name = "engine-core"
description = "Platform-independent DSP, analysis, scoring, mixer and project model. Must build for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
realfft = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
ts-rs = "10"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = "1"
