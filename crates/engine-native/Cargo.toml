[package]
name = "engine-native"
description = "Desktop host: decoding, resampling, playback, ONNX Runtime inference, stem cache."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
coreml = ["ort/coreml"]
directml = ["ort/directml"]
cuda = ["ort/cuda"]

[dependencies]
engine-core.workspace = true
engine-ml.workspace = true
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
cpal = "0.15"
rtrb = "0.3"
ort = { version = "=2.0.0-rc.10" }
