[package]
name = "workstation-desktop"
description = "Tauri 2 desktop host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["youtube"]
# YouTube import through local yt-dlp + ffmpeg (AGENTS.md §4.1).
youtube = ["dep:ingest"]
coreml = ["engine-native/coreml"]
directml = ["engine-native/directml"]
cuda = ["engine-native/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine-core.workspace = true
engine-native.workspace = true
engine-ml.workspace = true
ingest = { workspace = true, optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
