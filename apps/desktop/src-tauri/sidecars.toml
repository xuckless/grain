# Third-party binaries bundled with the desktop app (AGENTS.md §4.1), fetched by
# scripts/fetch_sidecars.py into binaries/ with Tauri's target-triple names and checked
# against the pinned sha256 before use. Bundled only by `tauri build --config
# tauri.bundle.conf.json`; plain builds find the tools on PATH instead.
#
# yt-dlp: official standalone release binaries; sha256 copied from that release's SHA2-256SUMS.
# ffmpeg/ffprobe: FFmpeg publishes no binaries. eugeneware/ffmpeg-static is the one GitHub
#   release that covers every target with a stable tag; sha256 are GitHub's own release-asset
#   digests. FFmpeg is LGPL-2.1+, these static builds include GPL components; both are fine
#   for this GPL-3.0 project. The matching LICENSE file is bundled next to the binaries.

[yt-dlp]
version = "2026.10.26"
license = "Unlicense"
source = "https://github.com/yt-dlp/yt-dlp/releases/tag/2026.10.26"

[ffmpeg]
version = "b6.1.1 release (its macOS binaries report FFmpeg 6.0)"
license = "GPL-3.0 (FFmpeg LGPL-2.1+, static build with GPL components)"
source = "https://github.com/eugeneware/ffmpeg-static/releases/tag/b6.1.1"

# One entry per Rust target triple: url + sha256 for each bundled file.
[target.aarch64-apple-darwin]
yt-dlp = { url = "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_macos", sha256 = "0f922c15ccc0b83eefa1c8bc9104e434318c4bf16e408e1ee93b7745a6efe0aa" }
